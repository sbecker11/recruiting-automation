name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bats:
    name: bats test suite
    # macos-latest (not ubuntu) because test_install.bats/test_ensure_running.bats
    # make real launchctl bootstrap/bootout calls against a throwaway -TEST-$$
    # label (see tests/README.md) — launchctl only exists on macOS runners.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core and coreutils
        # coreutils provides `gtimeout` (GNU timeout) — macOS ships no
        # `timeout` at all; lib/cycle_safety.sh's TIMEOUT_BIN resolution
        # (run_cycle.sh / tests/test_cycle_safety.bats) checks for either
        # name via `command -v`.
        run: brew install bats-core coreutils

      - name: Run bats test suite
        run: bats tests/
